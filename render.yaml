services:
  - type: worker
    name: telegram-monitor
    runtime: python
    repo: https://github.com/xsa520/v27_3_guardian
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python monitor.py"
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
